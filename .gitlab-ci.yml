# GitLab CI/CD — deploys to GitLab Pages (<username>.gitlab.io)
# index.html lives in public/ — GitLab Pages serves it natively, no copy needed.
image: busybox

pages:
  stage: deploy
  environment: production
  script:
    - echo "Deploying to $CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
